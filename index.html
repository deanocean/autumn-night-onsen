<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋夜露天風呂</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="intro" class="panel">
  <div class="panel-inner">
    <p class="eyebrow">第三階段 · 天空與日夜</p>
    <h1>秋夜露天風呂</h1>
    <p class="lead">湯、蒸氣、建築與天空已完成，可切換白天與夜晚。<br>樹、燈籠與小物仍是簡化版；紅葉、互動與聲音在後續階段加入。</p>
    <dl class="keys">
      <div><dt>W A S D</dt><dd>移動</dd></div>
      <div><dt>滑鼠</dt><dd>轉動視角</dd></div>
      <div><dt>Shift</dt><dd>快走</dd></div>
      <div><dt>T</dt><dd>切換白天／夜晚</dd></div>
      <div><dt>M</dt><dd>鳥瞰全區</dd></div>
      <div><dt>L</dt><dd>區域標籤</dd></div>
      <div><dt>Esc</dt><dd>釋放滑鼠</dd></div>
    </dl>
    <button id="start" type="button">進入場景</button>
  </div>
</div>

<button id="time" type="button" aria-pressed="false" hidden>切換到夜晚</button>
<div id="resume" hidden>點一下畫面繼續（或按住滑鼠拖曳轉動視角）</div>
<div id="err" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
